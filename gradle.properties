# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.9

# Mod Properties
mod_version=3.0.0
maven_group=com.example.autoflyer
archives_base_name=autoflyer

# Dependencies
fabric_version=0.114.0+1.21.4
modmenu_version=13.0.2

# Tang timeout / so lan thu lai khi tai thu vien qua mang, giup tranh loi
# "Premature end of chunk coded message body" do mang bi gian doan giua chung.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=500
